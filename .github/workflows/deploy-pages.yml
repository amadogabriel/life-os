# Build the Vite app and deploy it to GitHub Pages.
# Requires Pages source = "GitHub Actions" (Settings → Pages); the
# configure-pages step below attempts to enable that automatically.
#
# The Supabase URL and publishable (anon-role) key are safe to embed in a
# client build — data access is enforced by row-level security.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, real-app]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: /life-os/
          VITE_SUPABASE_URL: https://wzmhasemthrlagdsigbl.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable__vkLjkzkJbFvNuskCyUNQA_kGn5Roj6
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
