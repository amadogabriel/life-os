# Supabase pauses free projects after ~7 days without API activity.
# This twice-weekly ping guarantees the project stays awake even if you
# don't open the app. Add SUPABASE_URL and SUPABASE_ANON_KEY repo secrets.
name: Supabase keepalive

on:
  schedule:
    - cron: '0 3 * * 1,4' # Mon + Thu 03:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "No SUPABASE_URL secret set — skipping"
            exit 0
          fi
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/days?select=dow&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" > /dev/null
          echo "pinged"
